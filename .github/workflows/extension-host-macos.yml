name: extension-host-macos

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extension-host:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - name: extension host tests
        run: cargo test -p clouddeck-core --locked extension_host
      - name: toy extension round trip
        run: cargo test -p clouddeck-extension-toy --locked --test host_load
