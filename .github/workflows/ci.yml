name: ci

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang pkg-config \
            libssl-dev libfontconfig-dev libvulkan-dev mesa-vulkan-drivers \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxcb-xkb-dev \
            libxcb-randr0-dev fonts-dejavu-core
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable
          rustc --version
      - name: rustqual cache
        id: rustqual-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/rustqual
          key: rustqual-1.8.3-${{ runner.os }}
      - name: rustqual 1.8.3
        run: |
          if ! command -v rustqual >/dev/null || [ "$(rustqual --version)" != "rustqual 1.8.3" ]; then
            cargo install rustqual --version 1.8.3 --locked
          fi
          rustqual --version
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: shellcheck scripts
        run: shellcheck --severity=warning scripts/*.sh
