name: Linux validation

on:
  push:
  pull_request:

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Linux-testable core
        run: cargo test -p clouddeck-core --locked
      - name: Build core
        run: cargo build -p clouddeck-core --locked

  gpui:
    name: GPUI Linux check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install GPUI build libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Check desktop shell
        run: cargo check -p clouddeck-app --locked
