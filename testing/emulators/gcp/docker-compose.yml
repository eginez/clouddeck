services:
  floci-gcp:
    image: floci/floci-gcp:0.12.0
    ports:
      - "4588:4588"
    environment:
      FLOCI_GCP_BASE_URL: http://localhost:4588
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:4588/ || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s

  seed:
    image: curlimages/curl
    profiles: ["seed"]
    depends_on:
      floci-gcp:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/seed.sh"]
    environment:
      FLOCI_GCP_ENDPOINT: http://floci-gcp:4588
    volumes:
      - ./seed.sh:/seed.sh:ro
