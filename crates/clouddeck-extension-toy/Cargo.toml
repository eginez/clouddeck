[package]
name = "clouddeck-extension-toy"
version = "0.2.2"
edition = "2024"
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clouddeck-extension-api = { path = "../clouddeck-extension-api" }

[dev-dependencies]
clouddeck-core = { path = "../clouddeck-core", features = ["test-support"] }
serde_json = "1"
tempfile = "3"
