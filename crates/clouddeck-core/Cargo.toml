[package]
name = "clouddeck-core"
version = "0.2.1"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clouddeck-extension-api = { path = "../clouddeck-extension-api" }
clouddeck-provider-api = { path = "../clouddeck-provider-api" }
clouddeck-provider-kit = { path = "../clouddeck-provider-kit" }
ed25519-dalek = { version = "2", features = ["rand_core"] }
flate2 = "1"
hex = "0.4"
libc = "0.2"
libloading = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.8"
tokio = { version = "1", features = ["macros", "process", "time", "rt", "sync"] }
ureq = "2"
url = "2"

[features]
test-support = ["clouddeck-provider-kit/test-support"]

[dev-dependencies]
clouddeck-core = { path = ".", features = ["test-support"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
