[package]
name = "clouddeck-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.11.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-sdk-ec2 = { version = "1.250.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "rustls",
] }
aws-sdk-ssooidc = { version = "1.110.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "rustls",
] }
aws-sdk-sts = { version = "1.113.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "rustls",
] }
aws-types = "1.5.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "rt", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
