[package]
name = "clouddeck-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "clouddeck"
path = "src/main.rs"

[dependencies]
aws-config = "1.8.13"
aws-sdk-ec2 = "1.208.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clouddeck-core = { path = "../clouddeck-core" }
gpui = "0.2.2"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
tokio = { version = "1", features = ["macros", "rt"] }
