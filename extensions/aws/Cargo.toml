[package]
name = "clouddeck-aws"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "AWS provider for CloudDeck: EC2 listing, IAM Identity Center sign-in"
publish = false

[dependencies]
async-trait = "0.1"
aws-config = { version = "1.11.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
    "sso",
] }
aws-sdk-ec2 = { version = "1.250.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-ssooidc = { version = "1.110.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-sdk-sts = { version = "1.113.0", default-features = false, features = [
    "behavior-version-latest",
    "default-https-client",
    "rt-tokio",
] }
aws-types = "1.5.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clouddeck-core = { path = "../../crates/clouddeck-core" }
clouddeck-provider-api = { path = "../../crates/clouddeck-provider-api" }
hex = "0.4"
serde_json = "1"
sha1 = "0.10"
tokio = { version = "1", features = ["process", "time", "rt", "sync"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "test-util"] }
