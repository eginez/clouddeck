id = "aws"
name = "Amazon Web Services"
version = "0.1.0"
schema_version = 1
api_version = 7
authors = ["Esteban Ginez"]
repository = "https://github.com/eginez/clouddeck"

[providers.aws]
name = "Amazon Web Services"

[[settings]]
key = "config_dir"
label = "Config folder"
description = "An .aws-style folder with config and credentials. Empty uses ~/.aws or AWS_CONFIG_FILE."
kind = "folder"

[[settings]]
key = "config_file"
label = "AWS config file"
description = "Overrides the config file. Wins over the config folder."
kind = "path"
default = "~/.aws/config"

[[settings]]
key = "request_timeout"
label = "Request timeout"
description = "Per region, per request."
kind = "choice"
default = "30"
options = [
    { value = "15", label = "15 seconds" },
    { value = "30", label = "30 seconds" },
    { value = "60", label = "60 seconds" },
]

[[capabilities]]
kind = "network:http"
hosts = ["*.amazonaws.com"]
