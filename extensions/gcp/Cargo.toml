[package]
name = "clouddeck-gcp"
version = "0.2.2"
edition = "2024"
license.workspace = true
repository.workspace = true
description = "Google Compute Engine provider extension for CloudDeck"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clouddeck-extension-api = { path = "../../crates/clouddeck-extension-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["parsing"] }
ureq = { version = "2", default-features = false, features = ["tls"] }
